name: Release Obsidian Plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify release version
        run: |
          node -e 'const m = require("./manifest.json"); if (m.version !== process.env.GITHUB_REF_NAME || m.version !== require("./package.json").version || m.version !== require("./package-lock.json").version || require("./versions.json")[m.version] !== m.minAppVersion) throw new Error("Release version mismatch")'

      - name: Install, test and build
        run: |
          npm ci
          npm test
          npm run build
          git diff --exit-code -- main.js

      - name: Package plugin zip
        run: |
          rm -rf release-package "atpath-${GITHUB_REF_NAME}.zip"
          mkdir -p release-package/atpath
          cp main.js manifest.json styles.css release-package/atpath/
          cd release-package
          zip -r "../atpath-${GITHUB_REF_NAME}.zip" atpath

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --verify-tag \
            --notes-file "docs/releases/${GITHUB_REF_NAME}.md" \
            main.js manifest.json styles.css "atpath-${GITHUB_REF_NAME}.zip"
